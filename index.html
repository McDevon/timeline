<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    canvas {
      display: block;
    }
    .timeline-tooltip {
      position: fixed;
      padding: 8px 12px;
      background: #16213e;
      border: 1px solid #533483;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      z-index: 100;
      max-width: 300px;
    }
    .timeline-tooltip.visible {
      opacity: 1;
    }
    .timeline-tooltip .tooltip-dates {
      color: #b0b0b0;
      font-size: 12px;
    }
    .timeline-tooltip .tooltip-info {
      color: #a0a0a0;
      font-size: 12px;
    }
    .zoom-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 50;
    }
    .zoom-btn {
      width: 36px;
      height: 36px;
      border: 1px solid #533483;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-btn:hover {
      background: #1a3a5c;
      border-color: #7b52ab;
    }
    .zoom-btn:active {
      background: #0f2840;
    }
  </style>
</head>
<body>
  <canvas id="timeline-canvas"></canvas>
  <div class="zoom-controls">
    <button id="zoom-in" class="zoom-btn">+</button>
    <button id="zoom-out" class="zoom-btn">&minus;</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
