<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    canvas {
      display: block;
    }
    .timeline-tooltip {
      position: fixed;
      padding: 8px 12px;
      background: #16213e;
      border: 1px solid #533483;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      z-index: 100;
      max-width: 300px;
    }
    .timeline-tooltip.visible {
      opacity: 1;
    }
    .timeline-tooltip .tooltip-dates {
      color: #b0b0b0;
      font-size: 12px;
    }
    .timeline-tooltip .tooltip-approx {
      color: #9090b0;
      font-size: 12px;
      font-style: italic;
    }
    .timeline-tooltip .tooltip-info {
      color: #a0a0a0;
      font-size: 12px;
    }
    .zoom-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 50;
    }
    .zoom-btn {
      width: 36px;
      height: 36px;
      border: 1px solid #533483;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-btn:hover {
      background: #1a3a5c;
      border-color: #7b52ab;
    }
    .zoom-btn:active {
      background: #0f2840;
    }
    .event-list-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 260px;
      background: #16213e;
      border: 1px solid #533483;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: sans-serif;
      font-size: 13px;
      z-index: 50;
      overflow: hidden;
    }
    .event-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid #533483;
    }
    .event-list-header:hover {
      background: #1a3a5c;
    }
    .event-list-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .event-list-chevron {
      font-size: 14px;
      transition: transform 0.2s ease;
    }
    .event-list-panel.collapsed .event-list-chevron {
      transform: rotate(180deg);
    }
    .event-list-panel.collapsed .event-list-header {
      border-bottom: none;
    }
    .event-list-body {
      max-height: 50vh;
      overflow-y: auto;
      transition: max-height 0.2s ease;
    }
    .event-list-panel.collapsed .event-list-body {
      max-height: 0;
      overflow: hidden;
    }
    .event-list-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .event-list-row:hover,
    .event-list-row.highlighted {
      background: rgba(255, 255, 255, 0.05);
    }
    .event-list-row.hidden {
      opacity: 0.4;
    }
    .event-list-check {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      border: 1px solid #533483;
      border-radius: 3px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      line-height: 1;
      color: #7b52ab;
    }
    .event-list-row.hidden .event-list-check {
      border-color: #3a2560;
      color: transparent;
    }
    .event-list-info {
      flex: 1;
      min-width: 0;
    }
    .event-list-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event-list-dates {
      color: #b0b0b0;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event-list-body::-webkit-scrollbar {
      width: 6px;
    }
    .event-list-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .event-list-body::-webkit-scrollbar-thumb {
      background: #533483;
      border-radius: 3px;
    }
    .info-log {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      z-index: 60;
    }
    .info-log-message {
      background: #16213e;
      border: 1px solid #533483;
      color: #e0e0e0;
      padding: 8px 16px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
    .info-log-message.visible {
      opacity: 1;
    }
    .info-log-message.fading {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 52, 96, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
      font-family: sans-serif;
      font-size: 24px;
      font-weight: 600;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      border: 3px dashed #533483;
    }
    .drop-overlay.visible {
      opacity: 1;
    }
    .timeline-menu {
      position: fixed;
      bottom: 20px;
      left: 288px;
      width: 200px;
      background: #16213e;
      border: 1px solid #533483;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: sans-serif;
      font-size: 13px;
      z-index: 50;
      overflow: hidden;
    }
    .timeline-menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid #533483;
    }
    .timeline-menu-header:hover {
      background: #1a3a5c;
    }
    .timeline-menu-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .timeline-menu-chevron {
      font-size: 14px;
      transition: transform 0.2s ease;
    }
    .timeline-menu.collapsed .timeline-menu-chevron {
      transform: rotate(180deg);
    }
    .timeline-menu.collapsed .timeline-menu-header {
      border-bottom: none;
    }
    .timeline-menu-body {
      transition: max-height 0.2s ease;
    }
    .timeline-menu.collapsed .timeline-menu-body {
      max-height: 0;
      overflow: hidden;
    }
    .timeline-menu-btn {
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
    }
    .timeline-menu-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .timeline-menu-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }
    .timeline-menu-btn.destructive {
      color: #e05050;
    }
    .timeline-menu-btn.destructive:hover {
      background: rgba(224, 80, 80, 0.1);
    }
    .confirm-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
    }
    .confirm-backdrop.visible {
      opacity: 1;
    }
    .confirm-dialog {
      background: #16213e;
      border: 1px solid #533483;
      border-radius: 8px;
      padding: 20px 24px;
      max-width: 360px;
      color: #e0e0e0;
      font-family: sans-serif;
      font-size: 14px;
    }
    .confirm-message {
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .confirm-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .confirm-btn {
      padding: 6px 16px;
      border: 1px solid #533483;
      border-radius: 4px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
      font-family: sans-serif;
    }
    .confirm-btn:hover {
      background: #1a3a5c;
      border-color: #7b52ab;
    }
    .confirm-btn.destructive {
      background: #3a1515;
      border-color: #a03030;
      color: #e05050;
    }
    .confirm-btn.destructive:hover {
      background: #4a1f1f;
      border-color: #c04040;
    }
  </style>
</head>
<body>
  <canvas id="timeline-canvas"></canvas>
  <div class="zoom-controls">
    <button id="zoom-in" class="zoom-btn">+</button>
    <button id="zoom-out" class="zoom-btn">&minus;</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
