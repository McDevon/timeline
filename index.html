<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <style>
    :root {
      --tl-page-bg: #1a1a2e;
      --tl-panel-bg: #16213e;
      --tl-border: #533483;
      --tl-border-accent: #7b52ab;
      --tl-text: #e0e0e0;
      --tl-text-muted: #b0b0b0;
      --tl-text-approx: #9090b0;
      --tl-text-subtle: #a0a0a0;
      --tl-hover-bg: #1a3a5c;
      --tl-active-bg: #0f2840;
      --tl-list-highlight: rgba(255,255,255,0.05);
      --tl-list-highlight-strong: rgba(255,255,255,0.1);
      --tl-check-color: #7b52ab;
      --tl-check-hidden-border: #3a2560;
      --tl-scrollbar-thumb: #533483;
      --tl-destructive-text: #e05050;
      --tl-destructive-hover-bg: rgba(224,80,80,0.1);
      --tl-destructive-bg: #3a1515;
      --tl-destructive-border: #a03030;
      --tl-destructive-hover-border: #c04040;
      --tl-destructive-confirm-hover-bg: #4a1f1f;
      --tl-drop-overlay-bg: rgba(15,52,96,0.6);
      --tl-backdrop-bg: rgba(0,0,0,0.5);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--tl-page-bg);
    }
    canvas {
      display: block;
    }
    .timeline-tooltip {
      position: fixed;
      padding: 8px 12px;
      background: var(--tl-panel-bg);
      border: 1px solid var(--tl-border);
      border-radius: 6px;
      color: var(--tl-text);
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      z-index: 100;
      max-width: 300px;
    }
    .timeline-tooltip.visible {
      opacity: 1;
    }
    .timeline-tooltip .tooltip-dates {
      color: var(--tl-text-muted);
      font-size: 12px;
    }
    .timeline-tooltip .tooltip-approx {
      color: var(--tl-text-approx);
      font-size: 12px;
      font-style: italic;
    }
    .timeline-tooltip .tooltip-info {
      color: var(--tl-text-subtle);
      font-size: 12px;
    }
    .zoom-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 50;
    }
    .zoom-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--tl-border);
      border-radius: 6px;
      background: var(--tl-panel-bg);
      color: var(--tl-text);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-btn:hover {
      background: var(--tl-hover-bg);
      border-color: var(--tl-border-accent);
    }
    .zoom-btn:active {
      background: var(--tl-active-bg);
    }
    .event-list-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 300px;
      max-height: calc(100vh - 40px);
      background: var(--tl-panel-bg);
      border: 1px solid var(--tl-border);
      border-radius: 6px;
      color: var(--tl-text);
      font-family: sans-serif;
      font-size: 13px;
      z-index: 50;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
    }
    .event-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
      border-top: 1px solid var(--tl-border);
    }
    .event-list-header:hover {
      background: var(--tl-hover-bg);
    }
    .event-list-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .event-list-chevron {
      font-size: 14px;
      transition: transform 0.2s ease;
    }
    .event-list-panel.collapsed .event-list-chevron {
      transform: rotate(180deg);
    }
    .event-list-panel.collapsed .event-list-header {
      border-top: none;
    }
    .event-list-body {
      overflow-y: auto;
      min-height: 0;
      max-height: calc(100vh - 80px);
      transition: max-height 0.2s ease;
    }
    .event-list-panel.collapsed .event-list-body {
      max-height: 0;
      overflow: hidden;
    }
    .event-list-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .event-list-arrow {
      flex-shrink: 0;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .event-list-arrow.placeholder {
      visibility: hidden;
    }
    .event-list-arrow-icon {
      font-size: 10px;
      color: var(--tl-text-muted);
      transition: transform 0.2s ease;
    }
    .event-list-arrow-icon.expanded {
      transform: rotate(90deg);
    }
    .event-list-children {
      overflow: hidden;
      transition: max-height 0.2s ease;
    }
    .event-list-row:hover,
    .event-list-row.highlighted {
      background: var(--tl-list-highlight) !important;
    }
    .event-list-row.selected {
      background: rgba(200, 154, 44, 0.15) !important;
    }
    .event-list-row.selected:hover,
    .event-list-row.selected.highlighted {
      background: rgba(200, 154, 44, 0.25) !important;
    }
    .event-list-row.hidden {
      opacity: 0.4;
    }
    .event-list-check {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      border: 1px solid var(--tl-border);
      border-radius: 3px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      line-height: 1;
      color: var(--tl-check-color);
    }
    .event-list-row.hidden .event-list-check {
      border-color: var(--tl-check-hidden-border);
      color: transparent;
    }
    .event-list-info {
      flex: 1;
      min-width: 0;
    }
    .event-list-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event-list-dates {
      color: var(--tl-text-muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event-list-body::-webkit-scrollbar {
      width: 6px;
    }
    .event-list-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .event-list-body::-webkit-scrollbar-thumb {
      background: var(--tl-scrollbar-thumb);
      border-radius: 3px;
    }
    .info-log {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      z-index: 60;
    }
    .info-log-message {
      background: var(--tl-panel-bg);
      border: 1px solid var(--tl-border);
      color: var(--tl-text);
      padding: 8px 16px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
    .info-log-message.visible {
      opacity: 1;
    }
    .info-log-message.fading {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: var(--tl-drop-overlay-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tl-text);
      font-family: sans-serif;
      font-size: 24px;
      font-weight: 600;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      border: 3px dashed var(--tl-border);
    }
    .drop-overlay.visible {
      opacity: 1;
    }
    .timeline-menu {
      position: fixed;
      bottom: 20px;
      left: 328px;
      width: 200px;
      background: var(--tl-panel-bg);
      border: 1px solid var(--tl-border);
      border-radius: 6px;
      color: var(--tl-text);
      font-family: sans-serif;
      font-size: 13px;
      z-index: 50;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
    }
    .timeline-menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
      border-top: 1px solid var(--tl-border);
    }
    .timeline-menu-header:hover {
      background: var(--tl-hover-bg);
    }
    .timeline-menu-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .timeline-menu-chevron {
      font-size: 14px;
      transition: transform 0.2s ease;
    }
    .timeline-menu.collapsed .timeline-menu-chevron {
      transform: rotate(180deg);
    }
    .timeline-menu.collapsed .timeline-menu-header {
      border-top: none;
    }
    .timeline-menu-body {
      max-height: 300px;
      overflow: hidden;
      transition: max-height 0.2s ease;
    }
    .timeline-menu.collapsed .timeline-menu-body {
      max-height: 0;
      overflow: hidden;
    }
    .timeline-menu-btn {
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
    }
    .timeline-menu-btn:hover {
      background: var(--tl-list-highlight);
    }
    .timeline-menu-btn:active {
      background: var(--tl-list-highlight-strong);
    }
    .timeline-menu-btn.destructive {
      color: var(--tl-destructive-text);
    }
    .timeline-menu-btn.destructive:hover {
      background: var(--tl-destructive-hover-bg);
    }
    .confirm-backdrop {
      position: fixed;
      inset: 0;
      background: var(--tl-backdrop-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
    }
    .confirm-backdrop.visible {
      opacity: 1;
    }
    .confirm-dialog {
      background: var(--tl-panel-bg);
      border: 1px solid var(--tl-border);
      border-radius: 8px;
      padding: 20px 24px;
      max-width: 360px;
      color: var(--tl-text);
      font-family: sans-serif;
      font-size: 14px;
    }
    .confirm-message {
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .confirm-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .confirm-btn {
      padding: 6px 16px;
      border: 1px solid var(--tl-border);
      border-radius: 4px;
      background: var(--tl-page-bg);
      color: var(--tl-text);
      font-size: 13px;
      cursor: pointer;
      font-family: sans-serif;
    }
    .confirm-btn:hover {
      background: var(--tl-hover-bg);
      border-color: var(--tl-border-accent);
    }
    .confirm-btn.destructive {
      background: var(--tl-destructive-bg);
      border-color: var(--tl-destructive-border);
      color: var(--tl-destructive-text);
    }
    .confirm-btn.destructive:hover {
      background: var(--tl-destructive-confirm-hover-bg);
      border-color: var(--tl-destructive-hover-border);
    }
    .theme-flyout {
      position: fixed;
      background: var(--tl-panel-bg);
      border: 1px solid var(--tl-border);
      border-radius: 6px;
      padding: 4px 0;
      z-index: 60;
      font-family: sans-serif;
      font-size: 13px;
      color: var(--tl-text);
      min-width: 180px;
    }
    .theme-flyout-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
    }
    .theme-flyout-row:hover {
      background: var(--tl-list-highlight);
    }
    .theme-flyout-row.active {
      background: var(--tl-list-highlight-strong);
    }
    .theme-swatches {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }
    .theme-swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      border: 1px solid rgba(128,128,128,0.3);
    }
  </style>
</head>
<body>
  <canvas id="timeline-canvas"></canvas>
  <div class="zoom-controls">
    <button id="zoom-in" class="zoom-btn">+</button>
    <button id="zoom-out" class="zoom-btn">&minus;</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
