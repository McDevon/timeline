<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    canvas {
      display: block;
    }
    .timeline-tooltip {
      position: fixed;
      padding: 8px 12px;
      background: #16213e;
      border: 1px solid #533483;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      z-index: 100;
      max-width: 300px;
      cursor: default;
    }
    .timeline-tooltip.visible {
      opacity: 1;
    }
    .timeline-tooltip.locked {
      pointer-events: auto;
    }
    .timeline-tooltip .tooltip-dates {
      color: #b0b0b0;
      font-size: 12px;
    }
    .timeline-tooltip .tooltip-info {
      color: #a0a0a0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="timeline-canvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
